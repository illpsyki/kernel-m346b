name: Galaxy M34 Kernel Build

on:
  push:
    branches:
      - nethunter
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison flex build-essential libssl-dev \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          git wget cpio unzip rustc cargo

    # Cache clang toolchain
    - name: Cache clang toolchain
      id: cache-clang
      uses: actions/cache@v3
      with:
        path: ~/toolchains/clang-r416183b
        key: clang-r416183b

    - name: Download clang-r416183b
      if: steps.cache-clang.outputs.cache-hit != 'true'
      run: |
        mkdir -p $HOME/toolchains
        cd $HOME/toolchains
        git clone --depth=1 --branch aml_tz3_314012070 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
        mv linux-x86/clang-r416183b clang-r416183b
        rm -rf linux-x86

    # Cache kernel build output
    - name: Cache kernel build output
      id: cache-build
      uses: actions/cache@v3
      with:
        path: out
        key: kernel-${{ github.sha }}
        restore-keys: |
          kernel-

    # Patch defconfig to disable Samsung TUI
    - name: Patch defconfig
      run: |
        DEFCONFIG="arch/arm64/configs/s5e8825-m34xnsxx_defconfig"
        echo "# CONFIG_SAMSUNG_TUI is not set" >> $DEFCONFIG
        echo "# CONFIG_SAMSUNG_TUI_LOWLEVEL is not set" >> $DEFCONFIG
        echo "# CONFIG_SAMSUNG_TUI_TEST is not set" >> $DEFCONFIG

    - name: Build Kernel
      run: |
        export PATH=$HOME/toolchains/clang-r416183b/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export LLVM=1 LLVM_IAS=1
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export TARGET_SOC=s5e8825
        export PLATFORM_VERSION=12
        export ANDROID_MAJOR_VERSION=s

        mkdir -p out
        make O=out clean
        make O=out s5e8825-m34xnsxx_defconfig
        make O=out -j$(nproc)

    - name: Download stock boot.img
      run: |
        mkdir stock
        # Option A: Place stock_boot.img in repo root before pushing
        cp stock_boot.img stock/boot.img || true
        # Option B: Download from a direct link
        # wget -O stock/boot.img <URL_TO_STOCK_BOOT_IMG>

    - name: Build and install magiskboot
      run: |
        git clone --depth=1 https://github.com/topjohnwu/Magisk.git
        cd Magisk
        cargo build --release -p magiskboot
        sudo cp target/release/magiskboot /usr/local/bin/

    - name: Repack boot.img with new kernel
      run: |
        mkdir repack && cd repack
        cp ../stock/boot.img . || { echo "❌ stock/boot.img not found"; exit 1; }
        magiskboot unpack boot.img

        # Replace kernel with correct format
        if [ -f ../out/arch/arm64/boot/Image.gz-dtb ]; then
          cp ../out/arch/arm64/boot/Image.gz-dtb kernel
        elif [ -f ../out/arch/arm64/boot/Image.gz ]; then
          cp ../out/arch/arm64/boot/Image.gz kernel
        else
          cp ../out/arch/arm64/boot/Image kernel
        fi

        # Replace dtbo if exists
        if [ -f ../out/arch/arm64/boot/dtbo.img ]; then
          cp ../out/arch/arm64/boot/dtbo.img dtbo.img
        fi

        magiskboot repack boot.img new-boot.img
        cd ..

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-output
        path: |
          out/arch/arm64/boot/Image
          out/arch/arm64/boot/Image.gz
          out/arch/arm64/boot/Image.gz-dtb
          out/arch/arm64/boot/dtbo.img
          out/arch/arm64/boot/dts/**/*.dtb
          out/**/*.ko
          out/.config
          repack/new-boot.img
