name: Galaxy M34 Kernel Build

on:
  push:
    branches:
      - nethunter
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison flex build-essential libssl-dev \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          git wget cpio

    - name: Download clang-r416183b
      run: |
        mkdir -p $HOME/toolchains
        cd $HOME/toolchains
        wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-12.0.0_r36/clang-r416183b.tar.gz
        mkdir clang-r416183b && tar -xf clang-r416183b.tar.gz -C clang-r416183b

    - name: Build Kernel
      run: |
        export PATH=$HOME/toolchains/clang-r416183b/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export LLVM=1 LLVM_IAS=1
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export TARGET_SOC=s5e8825
        export PLATFORM_VERSION=12
        export ANDROID_MAJOR_VERSION=s

        make s5e8825-m34xnsxx_defconfig
        make -j$(nproc)

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-output
        path: |
          arch/arm64/boot/Image
          drivers/*/*.ko
